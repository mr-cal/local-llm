# ── PROXY ─────────────────────────────────────────────────────────────────────
# nginx TLS proxy - allows remote clients to reach llama-server securely.
# Skip [proxy] on a client-only machine.

[proxy]
enabled = true
# External HTTPS port nginx listens on (remote clients connect here).
port = 8443

# This machine's LAN IP address.
# Find it with: ip -4 addr show | grep 'inet ' | grep -v '127\\.0\\.0\\.1'
lan_ip = "192.168.1.100"

# LAN subnet allowed through nginx (CIDR). Requests from outside are rejected.
lan_subnet = "192.168.1.0/24"

# Path to the self-signed TLS certificate (public cert only, not the key).
# Generate with: uv run llm config gencert
cert_path = "/etc/ssl/local-llm/cert.pem"

# ── CLIENT ────────────────────────────────────────────────────────────────────
# How opencode, Pi, and other tools on THIS machine connect to the LLM.
#
# server+client machine: leave server_url empty - tools connect directly to
#   the local llama-server at http://127.0.0.1:<port> (no TLS, no auth).
#
# client-only machine: set server_url to the remote server's proxy URL,
#   and set cert_path as needed (auth is read from [auth]).

[client]
enabled = true
# Leave empty on a server+client machine (uses local server directly).
# Set to remote proxy URL on a client-only machine:
#   server_url = "https://192.168.1.x:8443/v1"
server_url = ""

# Path to the remote server's TLS cert PEM, for Node.js tools (Pi, opencode).
# Copy from the server: scp server:/etc/ssl/local-llm/cert.pem ~/.config/local-llm/cert.pem
# Then set NODE_EXTRA_CA_CERTS to this path in your shell profile.
cert_path = ""

# ── AUTH ──────────────────────────────────────────────────────────────────────
[auth]
# Bearer token for authentication:
#   - On a server+client machine: this token is used by remote clients to
#     authenticate when connecting to this server via the nginx proxy.
#     Leave empty if remote clients are not used (or if using a different
#     auth mechanism).
#   - On a client-only machine: this token is sent to the remote server
#     so it knows this client is authorized.
#     Set it to match the api_key configured on the remote server.
# Generate: python -c "import secrets; print(secrets.token_hex(32))"
api_key = ""

# ── GITHUB ────────────────────────────────────────────────────────────────
[github]
# GitHub personal access token for authenticating the gh CLI tool.
# Generate at: https://github.com/settings/tokens
# Required for gh CLI operations that need auth (e.g. private repos).
token = ""

# ── MODEL COST ────────────────────────────────────────────────────────────────
# Per-token pricing is driven by the active model's cost settings in
# [[models.list]] below.  Set cost.input / cost.output / cost.cache_write /
# cost.cache_read on the active model entry to control pricing.
# Set to 0 for free local models.  For cloud APIs, use the provider's rates.
# Values are in USD per token.

# ── BUILD ─────────────────────────────────────────────────────────────────────
# llama.cpp build system - compile from source with one or more profiles.
# Run `uv run llm build init` to initialize the submodule, then
# `uv run llm build run` to compile.

[build]
# Where built binaries are installed (per-profile subdirectory created here).
install_dir = "~/.local/lib/local-llm"

# Number of parallel make jobs. "auto" uses all CPU cores.
jobs = "auto"

# Build type: true = Release (default, optimized), false = Debug.
release = true

# Pinned llama.cpp commit. "HEAD" means latest (may change on `llm build update`).
# Pin to a specific commit for reproducibility, e.g.: commit = "abc1234"
commit = "HEAD"

# Define one or more build profiles. Each compiles llama.cpp with different flags.
# `uv run llm build info` shows which profiles are built and installed.

[[build.profiles]]
name = "vulkan-default"
backend = "vulkan"
# extra_flags = []   # add additional cmake -D flags here

[[build.profiles]]
name = "vulkan-flash"
backend = "vulkan"
extra_flags = ["-DGGML_FLASH_ATTN=ON"]

[lxd]
craft_dirs = [
    # "~/dev/craft/snapcraft/snapcraft-a",
]

# Directories to bind-mount from the host into the LXD container/VM.
[[lxd.mounts]]
host = "~/.agents"

[[lxd.mounts]]
host = "~/.github"

[[lxd.mounts]]
host = "~/dev"

[[lxd.mounts]]
name = "opencode-config"
host = "~/.config/opencode"
