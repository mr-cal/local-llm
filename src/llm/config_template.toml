# Local LLM Configuration
# Edit this file, then run:  uv run llm config apply
#
# Machine roles - set enabled per section:
#   server+client  - both enabled (most common)
#   server-only    - server enabled, client disabled
#   client-only    - client enabled, server disabled
#
# Sensitive values (api_key, hf_token) live only here - never committed.

# ── SERVER ────────────────────────────────────────────────────────────────────
# Skip [server] and [models] entirely on a client-only machine.

[server]
enabled = true
# Path to the llama-server binary.
# Leave empty if you configure [[build.profiles]] below - the binary will be
# resolved automatically from the active build profile.
llama_server_bin = ""

# Active build profile (from [[build.profiles]] below).
# If set, the built binary for this profile is used instead of llama_server_bin.
# Run `uv run llm build run` to build binaries.
profile = ""

# Internal HTTP port - llama-server listens here; nginx proxies to it.
port = 8080

# Model layers to offload to Vulkan iGPU (Radeon 890M).
# 0 = CPU only. Try 20–40 and tune up/down for speed.
n_gpu_layers = 20

# Context window in tokens. 131072+ recommended for agentic coding tasks.
n_ctx = 131072

# CPU inference threads. Recommended: physical core count (not hyperthreads).
n_threads = 12

# Extra llama-server flags (list of strings).
# Example: extra_args = ["--flash-attn", "--cache-type-k", "q8_0", "--jinja"]
extra_args = []

[models]
# Directory containing GGUF model files.
dir = "~/models"

# Active model - use the alias from [[models.list]] below.
# Run `uv run llm model list` to see options.
active = "qwen2.5-coder-14b-q4"

# HuggingFace token - only needed for gated/private models.
# Generate at: https://huggingface.co/settings/tokens
hf_token = ""

# ── MODEL CATALOG ─────────────────────────────────────────────────────────────
