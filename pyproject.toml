[project]
name = "local-llm"
version = "0.1.0"
description = "Local LLM server management CLI (llama.cpp + nginx + opencode)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.8",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "jsonschema>=4.26.0",
]

[project.scripts]
llm = "llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
data = ["src/llm/config_template.toml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "tomli-w>=1.0",
    "ty>=0.0.1a6",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"
